# Gradle 9.x requires a JDK 17+ to run. The build additionally pins a Java 21 toolchain
# for compilation, so the JDK that launches Gradle does not change the produced bytecode.
# If `gradlew` fails with an "unsupported class file major version" error, point JAVA_HOME
# at a JDK 17+ before invoking it. Machine specific paths belong in ~/.gradle/gradle.properties,
# never in this file.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
