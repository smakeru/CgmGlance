name: Release to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track to publish to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      target:
        description: 'Modules to publish'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - phone
          - wear
      bump:
        description: 'Increment versionCode automatically'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - both
          - phone
          - wear

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Release Keystore & Service Account
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cgmglance-release.keystore"
          cat <<EOF > keystore.properties
          storeFile=$RUNNER_TEMP/cgmglance-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Build and Upload to Google Play
        run: |
          python3 scripts/publish_play.py \
            --bump "${{ inputs.bump }}" \
            --target "${{ inputs.target }}" \
            --build \
            --upload "${{ inputs.track }}"

      - name: Upload Signed AAB Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-bundles-${{ inputs.track }}
          path: release/*.aab
          retention-days: 30
