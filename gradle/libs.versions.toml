# Single source of truth for every dependency version in the build.
# Versions were resolved against the live repositories on 2026-08-02, not from memory.

[versions]
# --- Toolchain -------------------------------------------------------------
agp = "9.3.1"
kotlin = "2.4.10"
javaToolchain = "21"

# --- Android SDK levels ----------------------------------------------------
# compileSdk stays at 36 because that is the newest platform installed on the build
# machine and every library below was verified to compile against it. AndroidX core-ktx
# 1.19.0 is the one artifact that demands 37; we do not use it.
compileSdk = "36"
targetSdk = "36"
# Phone floor: Android 8.0, the first release with the modern background execution
# and notification channel model this app depends on.
minSdkPhone = "26"
# Watch floor: Wear OS 3. Covers every watch still sold, and avoids a second Tiles
# rendering path for Wear OS 2 devices that cannot be realistically tested.
minSdkWear = "30"

# --- Libraries -------------------------------------------------------------
activityCompose = "1.13.0"
composeBom = "2026.06.01"
concurrentFutures = "1.3.0"
datastore = "1.2.1"
# Stable line. 1.2.0 is still alpha, and the write path here is the one part of the app that
# must not break on a library's own churn.
healthConnect = "1.1.0"
playServicesWearable = "20.0.1"
wearCompose = "1.6.2"
wearProtolayout = "1.4.2"
wearTiles = "1.6.2"
watchfaceComplications = "1.3.0"

# --- Testing ---------------------------------------------------------------
junit = "6.1.2"
# Robolectric only supports the JUnit 4 runner, so those tests run on the platform through the
# vintage engine alongside the JUnit 5 ones.
junit4 = "4.13.2"
robolectric = "4.16.1"

# --- Code quality ----------------------------------------------------------
spotless = "8.9.0"
ktlint = "1.8.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }

# TileService returns futures. This is the small androidx implementation rather than all of
# Guava, which would add megabytes to a watch APK for one call.
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "concurrentFutures" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Phone only. The watch never writes health data, and adding this to the wear module would
# put an unused dependency on a device with far less room for it.
androidx-health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }

play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }

wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "wearProtolayout" }
wear-protolayout-material3 = { module = "androidx.wear.protolayout:protolayout-material3", version.ref = "wearProtolayout" }
wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "wearTiles" }
wear-tiles-tooling-preview = { module = "androidx.wear.tiles:tiles-tooling-preview", version.ref = "wearTiles" }
watchface-complications-data-source-ktx = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "watchfaceComplications" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# No kotlin-android entry: AGP 9 has built-in Kotlin and rejects that plugin.
# The Compose compiler is still a separate plugin, and is mandatory since Kotlin 2.0.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
